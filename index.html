<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Series - API TMDB</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <h1 class="header__logo"> Club de Series</h1>
        <button class="header__toggle" id="theme-toggle" aria-label="Cambiar tema">🌙</button>
    </header>

    <main class="main">
        <section class="search-section">
            <input
                class="search-section__input"
                type="text"
                id="search"
                placeholder=" Buscar series...">
            <button class="search-section__clear" id="clear-search"> Limpiar</button>
        </section>

        <section class="results-header">
            <h2 class="results-header__title" id="results-title">Series Populares</h2>
            <p class="results-header__count" id="results-count"></p>
        </section>

        <div class="loading" id="loading" style="display: none;">
            <div class="loading__spinner"></div>
            <p class="loading__text">Cargando series...</p>
        </div>

        <div class="error" id="error" style="display: none;">
            <p class="error__icon">😢</p>
            <p class="error__message" id="error-message"></p>
            <button class="error__retry" id="retry-btn"> Intentar de nuevo</button>
        </div>

        <section class="series">
            <div class="series__grid" id="series-grid"></div>
        </section>
    </main>

    <div class="modal" id="serie-modal">
        <div class="modal__overlay" id="modal-overlay"></div>
        <div class="modal__content">
            <button class="modal__close" id="modal-close">✖</button>
            <div class="modal__body" id="modal-body"></div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="app.js"></script>
</body>
</html>
